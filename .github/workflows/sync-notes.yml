name: Sync Notes Bundle

on:
  push:
    branches:
      - main
    paths:
      - 'notes/**'
      - '!notes/manifest.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle notes into index.html and manifest.json
        run: node scripts/build.js

      - name: Commit updated bundle if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html notes/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-bundle notes into index.html and manifest.json [skip ci]"
            git push
          fi
